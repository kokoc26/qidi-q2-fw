name: Check and Download Firmware

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"
jobs:
  check_and_update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install necessary tools
        run: sudo apt-get install -y jq p7zip-full tar translate-shell

      - name: Fetch Firmware Info and Parse JSON
        id: firmware_info
        env:
          QIDI_DEVICE_ID: ${{ secrets.QIDI_DEVICE_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${QIDI_DEVICE_ID:-}" ]]; then
            echo "Repository secret QIDI_DEVICE_ID is required." >&2
            exit 1
          fi

          DEVICE_ID=$(printf '%s' "$QIDI_DEVICE_ID" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          if [[ ! "$DEVICE_ID" =~ ^[0-9A-F]+$ ]]; then
            echo "QIDI_DEVICE_ID must be the hexadecimal CPU serial from /proc/cpuinfo." >&2
            exit 1
          fi
          
          CURRENT_VERSION="01.01.01.01"
          TIMESTAMP=$(date +%s%3N)
          NONCE=$(openssl rand -hex 16)
          SIGNATURE=$(printf '%s' 'qidi3d null' |
            openssl dgst -sha256 -hmac 'qid3d-from-2025-CAFE-BABE' |
            sed 's/^.* //')

          RESPONSE=$(curl --fail-with-body --silent --show-error --get \
            'https://api.qidimaker.com/backend/v1/fireware/upgrade-info' \
            --data-urlencode 'hardware=QD_Q2' \
            --data-urlencode "currentVersion=$CURRENT_VERSION" \
            --data-urlencode "deviceId=$DEVICE_ID" \
            -H 'Accept: */*' \
            -H 'Accept-Language: en_US' \
            -H 'Content-Type: application/json' \
            -H "X-DeviceId: $DEVICE_ID" \
            -H 'X-DeviceType: Q2' \
            -H "X-Nonce: $NONCE" \
            -H 'X-Platform: 3DPrinter' \
            -H 'X-Region: NA' \
            -H "X-Signature: $SIGNATURE" \
            -H "X-Timestamp: $TIMESTAMP" \
            -H 'X-Timezone: +03:00' \
            -H "X-Version: $CURRENT_VERSION")

          if ! jq -e '.code == 200 and .data.version and .data.url' <<<"$RESPONSE" >/dev/null; then
            jq . <<<"$RESPONSE" >&2
            exit 1
          fi

          VERSION=$(jq -r '.data.version | ltrimstr("V")' <<<"$RESPONSE")
          SIZE=$(jq -r '.data.apkSize' <<<"$RESPONSE")
          DOWNLOAD_URL=$(jq -r '.data.url' <<<"$RESPONSE")
          DESCRIPTION_URL=$(jq -r '.data.description' <<<"$RESPONSE")
          RAW_DATE=$(echo "$DOWNLOAD_URL" | grep -oE '[0-9]{8}')
          DATE=$(echo "$RAW_DATE" | sed -E 's/([0-9]{4})([0-9]{2})([0-9]{2})/\1\/\2\/\3/')
          
          curl -s "$DESCRIPTION_URL" > wiki_raw.html
          DESCRIPTION_EN=$(awk -v ver="$VERSION" '
            BEGIN { found = 0; IGNORECASE = 1 }
            gsub(/^[Vv]/, "", ver);
            (/<h[1-6]/ || /id=/) && $0 ~ ver && !found { found = 1; next }
            found && (/<h2/ || (/<h3/ && $0 ~ /V[0-9]/) || $0 ~ /id="v[0-9]/) { exit }
            found {
              gsub(/<[^>]*>/, "", $0);
              gsub(/¶/, "", $0);
              if ($0 ~ /^[ \t]*[Ff]ixes[ \t]*$/ || $0 ~ /[Dd]ate:/ || $0 ~ /[Ss]ize:/ || $0 ~ /[Oo]ptimization/) next;
              clean_line = $0;
              gsub(/^[ \t\r\n]+|[ \t\r\n]+$/, "", clean_line);
              if (length(clean_line) > 0) {
                gsub(/^[-•*][ \t]*/, "", clean_line);
                print clean_line
              }
            }
          ' wiki_raw.html)

          DESCRIPTION_RU=$(echo "$DESCRIPTION_EN" | trans -b :ru)

          echo "VERSION=V$VERSION" >> $GITHUB_ENV
          echo "SIZE=$SIZE" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          echo "description_ru<<EOF_RU" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION_RU" | tr '\r' '\n' | sed 's/^/  - /' >> $GITHUB_OUTPUT
          echo "EOF_RU" >> $GITHUB_OUTPUT
          echo "description_en<<EOF_EN" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION_EN" | tr '\r' '\n' | sed 's/^/  - /' >> $GITHUB_OUTPUT
          echo "EOF_EN" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION_RU" | tr '\r' '\n' > firmware_description_ru.txt
          echo "$DESCRIPTION_EN" | tr '\r' '\n' > firmware_description_en.txt

      - name: Check if release/tag exists
        id: release_check
        run: |
          TAG_EXISTS=$(git tag -l ${{ env.VERSION }})
          if [ -n "$TAG_EXISTS" ]; then
            echo "Release for ${{ env.VERSION }} already exists. Skipping all next steps."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Release for ${{ env.VERSION }} does not exist. Proceeding."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Create working directories
        if: steps.release_check.outputs.skip == 'false'
        run: |
          mkdir -p work/q2
          mkdir -p work/soc
          mkdir -p firmware

      - name: Download Firmware
        if: steps.release_check.outputs.skip == 'false'
        run: |
          VERSION=${{ env.VERSION }}
          ZIP_FILENAME="Q2_${VERSION}.zip"
          DOWNLOAD_URL=${{ env.DOWNLOAD_URL }}
          echo "Downloading firmware $ZIP_FILENAME..."
          curl -L -o "$ZIP_FILENAME" "$DOWNLOAD_URL"
          echo "ZIP_FILENAME=$ZIP_FILENAME" >> $GITHUB_ENV

      - name: Unzip main archive
        if: steps.release_check.outputs.skip == 'false'
        run: |
          ZIP_FILENAME=${{ env.ZIP_FILENAME }}
          7z x "$ZIP_FILENAME" -o"work/q2"

      - name: Find and unzip inner SOC archive
        if: steps.release_check.outputs.skip == 'false'
        id: find_soc
        run: |
          SOC_ARCHIVE=$(find work/q2 -type f -name "QD_Q2_SOC*" -print -quit)
          if [ -z "$SOC_ARCHIVE" ]; then
            echo "::error::SOC archive (QD_Q2_SOC*) not found."
            exit 1
          fi
          echo "Found SOC archive: $SOC_ARCHIVE"
          7z x "$SOC_ARCHIVE" -o"work/soc"

      - name: Extract data.tar content
        if: steps.release_check.outputs.skip == 'false'
        run: |
          if [ ! -f work/soc/data.tar ]; then
            echo "::error::data.tar not found in work/soc."
            exit 1
          fi
          echo "Extracting data.tar..."
          tar -xf work/soc/data.tar -C firmware/

      - name: Clean up firmware directory before commit
        if: steps.release_check.outputs.skip == 'false'
        run: |
          echo "Remove bin more 50MB..."
          find firmware/ -type f -size +50M -delete
          
          echo "Remove Python cache (__pycache__)..."
          find firmware/ -type d -name "__pycache__" -exec rm -rf {} +
          
      - name: Configure Git and Commit changes
        if: steps.release_check.outputs.skip == 'false'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add firmware/
          
          if [ -n "$(git status --porcelain firmware/)" ]; then
            git commit -m "chore(firmware): Update Qidi Q2 firmware to ${{ env.VERSION }}"
            git push origin master
          else
            echo "No changes were staged for commit in 'firmware/' directory. Skipping commit and push."
          fi
        
      - name: Generate Direct Asset Link
        id: link_gen
        if: steps.release_check.outputs.skip == 'false'
        run: |
          REPO_NAME=${{ github.repository }}
          TAG_NAME=${{ env.VERSION }}
          ZIP_FILENAME=${{ env.ZIP_FILENAME }}
          RELEASE_ASSET_URL="https://github.com/${REPO_NAME}/releases/download/${TAG_NAME}/${ZIP_FILENAME}"
          echo "RELEASE_ASSET_URL=$RELEASE_ASSET_URL" >> $GITHUB_ENV

      - name: Create Github Release
        if: steps.release_check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: |
            ## Изменения (Russian):
            ${{ steps.firmware_info.outputs.description_ru }}

            ### Инструкция по загрузке

            > [!IMPORTANT]
            > При обновлении следуйте иструциям из [официального wiki QIDI Q2](https://wiki.qidi3d.com/en/Q2/firmware-update).

            > [!NOTE]
            > Загрузите архив, после извлечения переименуйте папку в `QD_Update` и поместите её в корневой каталог вашей флешки.
            > Затем подключите флешку к принтеру, чтобы приступить к офлайн обновлению.

            ---

            ## Changelog (English):
            ${{ steps.firmware_info.outputs.description_en }}

            ### Download Instruction

            > [!IMPORTANT]
            > Before updating, please follow the instructions on the [official QIDI Q2 wiki](https://wiki.qidi3d.com/en/Q2/firmware-update).

            > [!NOTE]
            > Download the archive, rename the folder to `QD_Update` after extraction, and place it in the root directory of your USB device.
            > Then connect the USB device to the printer to start the offline update.

          draft: false
          prerelease: false
          files: |
            ./${{ env.ZIP_FILENAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update READMEs
        if: steps.release_check.outputs.skip == 'false'
        run: |
          VERSION="${{ env.VERSION }}"
          SIZE="${{ env.SIZE }}"
          DATE="${{ env.DATE }}"
          RELEASE_ASSET_URL=${{ env.RELEASE_ASSET_URL }}
          DESCRIPTION_RU=$(cat firmware_description_ru.txt)
          DESCRIPTION_EN=$(cat firmware_description_en.txt)
          ROOT_README_FILE="README.md"
          CHANGELOG_HEADER_RU="## Список изменений (Changelog)"

          if [ ! -f "$ROOT_README_FILE" ]; then
              echo "# Прошивки QIDI Q2" > "$ROOT_README_FILE"
              echo "" >> "$ROOT_README_FILE"
              echo "[![QIDI RUSSIAN WIKI](https://img.shields.io/badge/QIDI%20RUSSIA%20WIKI-100000?style=for-the-badge&logo=data:image/svg+xml;base64,&labelColor=1b79ce&color=1668bd)](https://wiki.qidi-russia.ru/ru/Q2/)" >> "$ROOT_README_FILE"
              echo "[![QIDI WIKI](https://img.shields.io/badge/QIDI%20WIKI-100000?style=for-the-badge&logo=data:image/svg+xml;base64,&labelColor=1b79ce&color=1668bd)](https://wiki.qidi3d.com/en/Q2/)" >> "$ROOT_README_FILE"
              echo "" >> "$ROOT_README_FILE"
              echo "[English Version](./README.en.md) 🇺🇸" >> "$ROOT_README_FILE"
              echo "" >> "$ROOT_README_FILE"
              echo "## Инструкция по загрузке" >> "$ROOT_README_FILE"
              echo "" >> "$ROOT_README_FILE"
              echo "> [!IMPORTANT]" >> "$ROOT_README_FILE"
              echo "> При обновлении следуйте иструциям из [официального wiki QIDI Q2](https://wiki.qidi3d.com/en/Q2/firmware-update)." >> "$ROOT_README_FILE"
              echo "" >> "$ROOT_README_FILE"
              echo "> [!NOTE]" >> "$ROOT_README_FILE"
              echo "> Загрузите архив, после извлечения переименуйте папку в `QD_Update` и поместите её в корневой каталог вашей флешки." >> "$ROOT_README_FILE"
              echo "> Затем подключите флешку к принтеру, чтобы приступить к офлайн обновлению." >> "$ROOT_README_FILE"
              echo "" >> "$ROOT_README_FILE"
              echo "---" >> "$ROOT_README_FILE"
              echo "" >> "$ROOT_README_FILE"
              echo "$CHANGELOG_HEADER_RU" >> "$ROOT_README_FILE"
              echo "" >> "$ROOT_README_FILE"
          fi

          awk -v AWK_VAR="$CHANGELOG_HEADER_RU" '$0 == AWK_VAR {exit} {print}' "$ROOT_README_FILE" > README_HEADER_TEMP
          awk -v AWK_VAR="$CHANGELOG_HEADER_RU" '$0 == AWK_VAR {found=1; next} {if (found) print}' "$ROOT_README_FILE" > README_CHANGELOG_TEMP

          DOWNLOAD_LINK_UNIVERSAL_RU="[Скачать архив](${RELEASE_ASSET_URL})"

          {
            cat README_HEADER_TEMP
            echo ""
            echo "$CHANGELOG_HEADER_RU"
            echo ""
            echo "### $VERSION - $DATE"
            echo ""
            echo "#### Ссылка на прошивку:"
            echo ""
            echo "- $DOWNLOAD_LINK_UNIVERSAL_RU"
            echo ""
            echo "#### Изменения:"
            echo ""
            echo "$DESCRIPTION_RU" | sed 's/^/  - /'
            echo ""
            cat README_CHANGELOG_TEMP  
          } > README_TEMP && mv README_TEMP "$ROOT_README_FILE"

          ROOT_README_EN_FILE="README.en.md"
          CHANGELOG_HEADER_EN="## Changelog"

          if [ ! -f "$ROOT_README_EN_FILE" ]; then
              echo "# QIDI Q2 Firmware" > "$ROOT_README_EN_FILE"
              echo "" >> "$ROOT_README_EN_FILE"
              echo "[![QIDI RUSSIAN WIKI](https://img.shields.io/badge/QIDI%20RUSSIA%20WIKI-100000?style=for-the-badge&logo=data:image/svg+xml;base64,&labelColor=1b79ce&color=1668bd)](https://wiki.qidi-russia.ru/ru/Q2/)" >> "$ROOT_README_EN_FILE"
              echo "[![QIDI WIKI](https://img.shields.io/badge/QIDI%20WIKI-100000?style=for-the-badge&logo=data:image/svg+xml;base64,&labelColor=1b79ce&color=1668bd)](https://wiki.qidi3d.com/en/Q2/)" >> "$ROOT_README_EN_FILE"
              echo "" >> "$ROOT_README_EN_FILE"
              echo "[Русская версия](./README.md) 🇷🇺" >> "$ROOT_README_EN_FILE"
              echo "" >> "$ROOT_README_EN_FILE"
              echo "## Download Instruction" >> "$ROOT_README_EN_FILE"
              echo "" >> "$ROOT_README_EN_FILE"
              echo "> [!IMPORTANT]" >> "$ROOT_README_EN_FILE"
              echo "> Before updating, please follow the instructions on the [official QIDI Q2 wiki](https://wiki.qidi3d.com/en/Q2/firmware-update)." >> "$ROOT_README_EN_FILE" 
              echo "" >> "$ROOT_README_EN_FILE"
              echo "> [!NOTE]" >> "$ROOT_README_EN_FILE"
              echo "> Download the archive, rename the folder to `QD_Update` after extraction, and place it in the root directory of your USB device." >> "$ROOT_README_EN_FILE"
              echo "> Then connect the USB device to the printer to start the offline update." >> "$ROOT_README_EN_FILE"
              echo "" >> "$ROOT_README_EN_FILE"
              echo "---" >> "$ROOT_README_EN_FILE"
              echo "" >> "$ROOT_README_EN_FILE"
              echo "$CHANGELOG_HEADER_EN" >> "$ROOT_README_EN_FILE"
              echo "" >> "$ROOT_README_EN_FILE"
          fi

          awk -v AWK_VAR="$CHANGELOG_HEADER_EN" '$0 == AWK_VAR {exit} {print}' "$ROOT_README_EN_FILE" > README_EN_HEADER_TEMP
          awk -v AWK_VAR="$CHANGELOG_HEADER_EN" '$0 == AWK_VAR {found=1; next} {if (found) print}' "$ROOT_README_EN_FILE" > README_EN_CHANGELOG_TEMP

          DOWNLOAD_LINK_UNIVERSAL_EN="[Download archive](${RELEASE_ASSET_URL})"

          {
            cat README_EN_HEADER_TEMP
            echo ""
            echo "$CHANGELOG_HEADER_EN"
            echo ""
            echo "### $VERSION - $DATE"
            echo ""
            echo "#### Firmware Link:"
            echo ""
            echo "- $DOWNLOAD_LINK_UNIVERSAL_EN"
            echo ""
            echo "#### Changes:"
            echo ""
            echo "$DESCRIPTION_EN" | sed 's/^/  - /'
            echo ""
            cat README_EN_CHANGELOG_TEMP
          } > README_EN_TEMP && mv README_EN_TEMP "$ROOT_README_EN_FILE"

      - name: Configure Git and Commit changes
        if: steps.release_check.outputs.skip == 'false'
        uses: iarekylew00t/verified-bot-commit@v2
        with:
          message: "chore(release): Update Changelog with Release link for ${{ env.VERSION }}"
          files: |
            README.md
            README.en.md

      - name: Remove Temporary Files
        if: steps.release_check.outputs.skip == 'false'
        run: rm -rf work firmware firmware_description_ru.txt firmware_description_en.txt ZIP_FILENAME README_HEADER_TEMP README_CHANGELOG_TEMP README_EN_HEADER_TEMP README_EN_CHANGELOG_TEMP

      - name: Inform about skip
        if: steps.release_check.outputs.skip == 'true'
        run: echo "No new firmware version found to commit."
