<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="qidi">
    <allow own="org.qidi.klipper"/>
    <allow own="org.qidi.moonraker"/>
    <allow own="org.qidi.qidi-client"/>
    <allow send_interface="org.qidi.signal"/>
  </policy>

  <policy user="root">
    <allow own="org.qidi.klipper"/>
    <allow own="org.qidi.moonraker"/>
    <allow own="org.qidi.qidi-client"/>
    <allow send_interface="org.qidi.signal"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.qidi.klipper"/>
    <allow send_destination="org.qidi.moonraker"/>
    <allow send_destination="org.qidi.qidi-client"/>
    
    <allow receive_sender="org.qidi.klipper"/>
    <allow receive_sender="org.qidi.moonraker"/>
    <allow receive_sender="org.qidi.qidi-client"/>
    
    <allow receive_interface="org.qidi.signal"/>
  </policy>
</busconfig>